spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

cloud.aws.region.static=${AWS_REGION}
aws.bucket.name=${AWS_BUCKET_NAME}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.redis.host=${REDIS_HOST:redis-app}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=${REDIS_DATABASE:0}
spring.redis.timeout=${REDIS_TIMEOUT:2000}

spring.redis.jedis.pool.max-active=${REDIS_JEDIS_POOL_MAX_ACTIVE:8}
spring.redis.jedis.pool.max-idle=${REDIS_JEDIS_POOL_MAX_IDLE:8}
spring.redis.jedis.pool.min-idle=${REDIS_JEDIS_POOL_MIN_IDLE:0}
spring.redis.jedis.pool.max-wait=${REDIS_JEDIS_POOL_MAX_WAIT:-1}